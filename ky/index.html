  .dong:last-child{border-bottom:0}
  .dong span:first-child{color:var(--mo)}

  #toanVan p{margin:0 0 8px}
  #toanVan p.dich{color:#2B3440;margin:-4px 0 12px;padding-left:9px;border-left:3px solid #CDD5DE}
  #toanVan .ghi{background:var(--vang);padding:8px;border-radius:8px}
  #qdKhung{display:none}
  .qd img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #E3E6EB;margin-top:10px;background:#FAFBFC;min-height:120px}
  .qd a.tai{display:block;text-align:center;margin-top:6px;font-size:14px;color:var(--xanh)}
  label.o{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #EEF0F3;font-size:15px}
  label.o:last-of-type{border-bottom:0}
  label.o input{width:24px;height:24px;flex:0 0 24px;margin:0;accent-color:var(--xanh)}
  input.o-nhap,select{width:100%;font-size:17px;padding:12px;border:1px solid var(--vien);border-radius:10px;background:#fff;color:var(--muc)}
  .hang{display:flex;gap:8px}
  .hang select{flex:0 0 38%}
  .sdtSan{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sdtSan b{font-size:19px;letter-spacing:.02em}
  .lk{background:none;border:0;color:var(--xanh);text-decoration:underline;font-size:14px;padding:6px 0}
  .ckA{display:flex;align-items:center;gap:12px;border:1px solid #E3E6EB;border-radius:10px;padding:6px 10px;margin:4px 0 12px}
  .ckA img{height:64px;width:auto;flex:0 0 auto}
  .ckA span{font-size:13px;color:var(--mo);line-height:1.35}
  .ckA b{color:var(--muc)}
  .khungKy{position:relative;border:2px dashed var(--vien);border-radius:12px;background:#fff;touch-action:none;margin-top:6px}
  .khungKy canvas{display:block;width:100%;height:180px;border-radius:12px}
  .khungKy .goi{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#B7BDC7;pointer-events:none;font-size:15px}
  .kyLai{background:none;border:0;color:var(--mo);text-decoration:underline;font-size:14px;padding:6px 0;margin-top:4px}
  .chinh{display:block;width:100%;margin-top:14px;padding:16px;font-size:18px;font-weight:700;border:0;border-radius:12px;background:var(--xanh);color:#fff}
  .chinh:disabled{background:#AEB5BF}
  .loi{color:var(--do);font-size:14px;margin-top:8px;min-height:1px}
  .xong{text-align:center}
  .xong .dau{font-size:52px;line-height:1}
  .lienhe{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
  .lienhe a,.lienhe button{display:block;text-align:center;padding:11px 4px;border-radius:10px;border:1px solid var(--vien);background:#fff;color:var(--muc);text-decoration:none;font-size:14px}
  .nhac{background:var(--vang);border-radius:10px;padding:10px 12px;text-align:left;font-size:15px;margin-top:12px}
  .che{position:fixed;inset:0;background:rgba(255,255,255,.75);display:none;align-items:center;justify-content:center;font-weight:600;z-index:9}
  .che.hien{display:flex}
  .an{display:none!important}

  var tham = new URLSearchParams(location.search), MA = (tham.get('t') || '').trim();
  var NN = (function () { var l = (navigator.language || 'vi').toLowerCase(); return l.indexOf('zh') === 0 ? 'zh' : l.indexOf('vi') === 0 ? 'vi' : 'en'; })();
  var DL = null, KQ = null, DA_DOC = false, KENH = 0, DOI_SO = false;
  var $ = function (id) { return document.getElementById(id); };
  var e = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function t(k) { return T[NN][k]; }
  /** Nhãn phần hợp đồng: Tiếng Việt + ngôn ngữ đã chọn. */
  function L(k) { return NN === 'vi' ? T.vi[k] : T.vi[k] + ' / ' + T[NN][k]; }

  document.querySelectorAll('.nn button').forEach(function (b) {
    b.onclick = function () { NN = b.getAttribute('data-nn'); ve(); };
  });

  function goi(body) {
    return fetch(CONG, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function che(b, chu) { $('che').className = b ? 'che hien' : 'che'; if (chu) $('cheChu').textContent = chu; }

  function tai() {
    if (!/^[0-9a-f]{40}$/.test(MA)) { DL = { loi: 'MA' }; return ve(); }
    DL = null; ve();
    goi({ ky: 'xem', t: MA }).then(function (r) {
      if (!r.ok) { DL = { loi: r.ma_loi || 'MA' }; return ve(); }
      if (r.da_ky) { KQ = r; DL = { phieu: r.phieu }; return ve(); }
      DL = r; ve();
    }, function () { DL = { loi: 'MANG' }; ve(); });
  }

  /* ── vẽ trang theo trạng thái ── */
  function ve() {
    document.documentElement.lang = NN === 'zh' ? 'zh-CN' : NN;
    document.querySelectorAll('.nn button').forEach(function (b) { b.className = b.getAttribute('data-nn') === NN ? 'chon' : ''; });
    var nd = $('noiDung');
    if (!DL) { nd.innerHTML = '<div class="the mo">' + t('tai') + '</div>'; return; }
    if (DL.loi) {
      var m = { MA: t('loiMA'), HET: t('loiHET'), HUY: t('loiHUY'), MANG: t('loiMang') }[DL.loi] || t('loiMA');
      nd.innerHTML = '<div class="the"><h1>' + e(m) + '</h1><p class="mo">' + (DL.loi === 'MANG' ? '' : e(t('loiChung'))) + '</p>' +
        (DL.loi === 'MANG' ? '<button class="chinh" id="thuLai">' + e(t('thuLai')) + '</button>' : '') + lienHe() + '</div>';
      if ($('thuLai')) $('thuLai').onclick = tai;
      ganLienHe(); return;
    }
    if (KQ) return veXong();
    veForm();
  }

  /* ── thông tin hai bên: Bên A và Bên B cùng một khuôn, không che ── */
  function kv(k, v) {
    return '<div class="kv"><span class="k">' + k + '</span>' + (v ? '<span class="v">' + e(v) + '</span>' : '<span class="v trong">…</span>') + '</div>';
  }
  /** gon = máy chủ cũ (chưa có trường mới): bỏ các dòng trống thay vì hiện «…». */
  function khoiBen(tieuDe, o, them, gon) {
    var ns = String(o.ns || ''), cham = '…', h = function (k, v) { return gon && !v ? '' : kv(k, v); };
    var gt = gon ? (o.gt || '') : (o.gt || cham) + ' — ' + L('capNgay') + ' ' + (o.ngay_cap || cham) + ' — ' + L('taiCQ') + ' ' + (o.noi_cap || cham);
    return '<div class="ben"><div class="bt">' + tieuDe + '</div>' +
      h(L('ongBa'), o.ten ? String(o.ten).toUpperCase() : '') +
      h(ns.length === 4 ? L('sinhNam') : L('sinhNgay'), ns) +
      h(L('giayTo'), gt) +
      h(L('thuongTru'), o.thuong_tru) +
      h(L('sdt'), o.sdt) + (them || '') + '</div>';
  }
  function benA(p) {
    var a = p.a;
    if (a && (a.ten || a.gt)) return a;
    return { ten: String(p.ben_a || '').split(' · ')[0], sdt: HOTLINE };      // máy chủ cũ: chỉ có tên + SĐT
  }
  function soSan(p) { var s = String((p && p.sdt_so) || '').trim(); return s.replace(/\D/g, '').length >= 8 ? s : ''; }
  function benB(p) {
    return { ten: p.ten, ns: p.ns || '', gt: p.giay_to, ngay_cap: p.ngay_cap, noi_cap: p.noi_cap,
             thuong_tru: p.thuong_tru, sdt: soSan(p) || (KQ && KQ.sdt) || '' };
  }
  function haiBen(p) {
    var gon = !(p.a && (p.a.ten || p.a.gt));
    var them = kv(L('quocTich'), p.qt || 'Việt Nam') + (p.luu_tru ? kv(L('luuTru'), p.luu_tru) : '');
    return '<div class="the"><h2>' + t('ben2') + '</h2>' + khoiBen(L('benA2'), benA(p), '', gon) + khoiBen(L('benB2'), benB(p), them, gon) + '</div>';
  }

  function tongTien(ds, k) {
    var s = 0; ds.forEach(function (x) { s += Number(String(x[k] || '').replace(/\D/g, '')) || 0; });
    return s.toLocaleString('vi-VN').replace(/,/g, '.') + ' đ';
  }
  function hopPhieu(p) {
    var xe = (p.xe || []).map(function (x) {
      return '<div class="xe"><b>' + e(x.loai) + ' · ' + e(x.bien) + '</b>' +
        '<div class="dong"><span>' + t('goi') + '</span><span>' + e(x.ht) + ' × ' + e(x.sl) + '</span></div>' +
        '<div class="dong"><span>' + t('tienThue') + '</span><span>' + e(x.thue || x.dg) + ' đ</span></div>' +
        '<div class="dong"><span>' + t('coc') + '</span><span>' + e(x.coc) + ' đ</span></div>' +
        '<div class="dong"><span>' + t('pin') + '</span><span>' + e(x.pin) + '%</span></div>' +
        '<div class="dong"><span>' + t('quaGio') + '</span><span>' + e(x.qua_gio) + ' đ / h</span></div>' +
        '<div class="dong"><span>' + t('sac') + '</span><span>' + (x.sac ? t('co') : t('khong')) + '</span></div></div>';
    }).join('');
    var tong = (p.xe || []).length > 1 ? '<div class="dong"><span>' + t('tong') + ' · ' + t('tienThue') + ' / ' + t('coc') + '</span><span>' +
      tongTien(p.xe, 'thue') + ' / ' + tongTien(p.xe, 'coc') + '</span></div>' : '';
    var diaDiem = (p.dia_giao || p.dia_tra) ? '<div class="dong"><span>' + t('giaoTra') + '</span><span>' +
      e(p.dia_giao || t('diaHen')) + ' / ' + e(p.dia_tra || t('diaHen')) + '</span></div>' : '';
    return '<div class="the"><h1>' + t('tieuDe') + '</h1><div class="mo">' + t('hd') + ' ' + e(p.soHD) + '</div></div>' +
      haiBen(p) +
      '<div class="the"><h2>' + t('xeGio') + '</h2>' +
      '<div class="dong"><span>' + t('nhan') + '</span><span>' + e(p.nhan) + '</span></div>' +
      '<div class="dong"><span>' + t('tra') + '</span><span>' + e(p.tra) + '</span></div>' + diaDiem + xe + tong + '</div>';
  }

  /* ── thẻ Quy định v30: ngôn ngữ đã chọn trước, rồi bản Tiếng Việt ── */
  function anhQD() {
    return (NN === 'vi' ? ['vi'] : [NN, 'vi']).map(function (k) {
      var ten = 'QUY_DINH_v30_' + k.toUpperCase() + '.jpg', src = 'qd/' + ten;
      return '<img loading="lazy" src="' + src + '" alt="' + e(T[k].qdTieuDe) + '">' +
        '<a class="tai" href="' + src + '" download="' + ten + '">⬇ ' + e(t('luuQD')) + ' (' + k.toUpperCase() + ')</a>';
    }).join('');
  }

  /* ── toàn văn: song ngữ từng đoạn khi máy chủ có bản dịch (zz_v67), không thì như v1.0 ── */
  function toanVan(dk) {
    var dich = NN !== 'vi' && dk.dich && dk.dich[NN] && dk.dich[NN].length === dk.vi.length ? dk.dich[NN] : null;
    if (dich) {
      return '<p class="ghi">' + e(t('ghiSongNgu')) + '</p>' +
        '<p><b>' + e(dk.tieu_de) + '</b><br><i>' + e((dk.dich.tieu_de || {})[NN] || '') + '</i></p>' +
        dk.vi.map(function (s, i) { return '<p>' + e(s) + '</p><p class="dich">' + e(dich[i]) + '</p>'; }).join('');
    }
    return (NN === 'vi' ? '' : '<p class="ghi">' + e(t('ghiNgonNgu')) + '</p>' +
        (NN === 'en' ? dk.en_tom : dk.zh_tom).map(function (s) { return '<p>' + e(s) + '</p>'; }).join('') + '<hr>') +
      '<p><b>' + e(dk.tieu_de) + '</b></p>' + dk.vi.map(function (s) { return '<p>' + e(s) + '</p>'; }).join('');
  }

  function veForm() {
    var p = DL.phieu, dk = DL.dk, nd = $('noiDung'), san = soSan(p), dungSan = san && !DOI_SO;
    var giu = { o1: $('o1') && $('o1').checked, o2: $('o2') && $('o2').checked, o3: $('o3') && $('o3').checked, sdt: $('sdt') ? $('sdt').value : '' };
    var anh = CK.coNet() ? CK.layAnh() : null;
    var khoiSdt = dungSan
      ? '<div class="sdtSan"><b>' + e(san) + '</b><span class="mo">' + e(t('sdtSan')) + '</span></div>' +
        '<button class="lk" id="doiSo">' + e(t('doiSo')) + '</button>'
      : '<div class="hang"><select id="kenh">' +
          t('kenh').map(function (k, i) { return '<option value="' + i + '"' + (i === KENH ? ' selected' : '') + '>' + e(k) + '</option>'; }).join('') +
        '</select><input class="o-nhap" id="sdt" type="tel" inputmode="tel" autocomplete="tel" placeholder="' + e(t('lienHeGoi')) + '"></div>' +
        (san ? '<button class="lk" id="doiSo">' + e(t('dungSoCu')) + ' (' + e(san) + ')</button>' : '');
    var ckA = DL.a_ky ? '<div class="ckA"><img src="' + DL.a_ky + '" alt=""><span><b>' + e(L('ckA')) + '</b><br>' + e(t('ckAGhi')) + '</span></div>' : '';
    nd.innerHTML = hopPhieu(p) +
      '<div class="the"><h2>' + t('bb') + '</h2><ul class="bb">' + t('bbDs').map(function (s) { return '<li>' + e(s) + '</li>'; }).join('') + '</ul>' +
      '<button class="nut2" id="moQD">' + e(t('xemQD')) + '</button><div class="qd" id="qdKhung"></div>' +
      '<button class="nut2" id="moTV">' + t('docToanVan') + ' ' + e(dk.ban) + '</button><div id="toanVan">' + toanVan(dk) + '</div></div>' +
      '<div class="the"><h2>' + t('xn') + '</h2>' +
      '<label class="o"><input type="checkbox" id="o1"><span>' + t('o1').replace('{ban}', e(dk.ban)) + '</span></label>' +
      '<label class="o"><input type="checkbox" id="o2"><span>' + t('o2') + '</span></label>' +
      '<label class="o"><input type="checkbox" id="o3"><span>' + t('o3') + '</span></label></div>' +
      '<div class="the"><h2>' + t('lienHe') + '</h2>' + khoiSdt + '</div>' +
      '<div class="the"><h2>' + t('kyTen') + '</h2>' + ckA + '<div class="mo">' + e(t('ckB')) + '</div>' +
      '<div class="khungKy"><canvas id="ck"></canvas><div class="goi" id="ckGoi">' + t('kyGoi') + '</div></div>' +
      '<button class="kyLai" id="kyLai">' + t('kyLai') + '</button>' +
      '<button class="chinh" id="gui">' + t('nut') + '</button><div class="loi" id="loi"></div></div>';
    $('o1').checked = !!giu.o1; $('o2').checked = !!giu.o2; $('o3').checked = !!giu.o3;
    if ($('sdt')) $('sdt').value = giu.sdt || '';
    if ($('doiSo')) $('doiSo').onclick = function () { DOI_SO = !DOI_SO; veForm(); if ($('sdt')) $('sdt').focus(); };
    $('moQD').onclick = function () {
      var k = $('qdKhung'), m = k.style.display !== 'block';
      if (m && !k.innerHTML) k.innerHTML = anhQD();
      k.style.display = m ? 'block' : 'none';
      this.textContent = m ? t('anQD') : t('xemQD');
    };
    $('moTV').onclick = function () {
      var m = $('toanVan').style.display !== 'block';
      $('toanVan').style.display = m ? 'block' : 'none';
      this.textContent = (m ? t('anToanVan') : t('docToanVan') + ' ' + dk.ban);
      if (m) DA_DOC = true;
    };
    if ($('kenh')) $('kenh').onchange = function () { KENH = Number(this.value); };
    CK.gan($('ck'), anh);
    $('kyLai').onclick = function () { CK.xoa(); };
    $('gui').onclick = gui;
  }

  function gui() {
    var loi = $('loi'); loi.textContent = '';
    if (!($('o1').checked && $('o2').checked && $('o3').checked)) { loi.textContent = t('thieuO'); return; }
    var san = soSan(DL.phieu), dungSan = !!(san && !DOI_SO);
    var sdt = dungSan ? san : $('sdt').value.trim();
    if (sdt.replace(/\D/g, '').length < 8) { loi.textContent = t('thieuSdt'); if ($('sdt')) $('sdt').focus(); return; }
    if (!CK.du()) { loi.textContent = t('thieuKy'); return; }
    che(true, t('dangGui'));
    goi({ ky: 'ky', t: MA, nn: NN, da_doc: DA_DOC, ua: navigator.userAgent, sdt: sdt,
          lien_he: dungSan ? 'Ghi sẵn trên app' : T.vi.kenh[KENH], sdt_san: dungSan, xn: 2,
          o: { dk: true, dl: true, xe: true }, chu_ky: CK.layAnh() })
      .then(function (r) {
        che(false);
        if (!r.ok) {
          if (r.ma_loi) { DL = { loi: r.ma_loi }; return ve(); }
          loi.textContent = r.loi || t('matMang'); return;
        }
        if (!r.sdt) r.sdt = sdt;
        KQ = r; ve(); window.scrollTo(0, 0);
      }, function () { che(false); loi.textContent = t('matMang'); });
  }

  function veXong() {
    var p = KQ.phieu || DL.phieu || {}, moi = !!(DL && DL.v67);
    $('noiDung').innerHTML = '<div class="the xong"><div class="dau">✅</div><h1>' + t('xong') + '</h1>' +
      '<p>' + e(t('xongMo').replace('{hd}', p.soHD || '').replace('{luc}', KQ.luc || '')) + '</p>' +
      (KQ.pdf ? '<button class="chinh" id="pdf">' + t('taiPdf') + '</button>' + (moi ? '<p class="mo">' + e(t('pdfKem')) + '</p>' : '') : '') +
      '<div class="nhac">' + t('nhac').map(function (s) { return '• ' + e(s.replace('{tra}', p.tra || '')); }).join('<br>') + '</div>' +
      '<h2 style="margin-top:16px">' + t('nhan2') + '</h2>' + lienHe() + '</div>' +
      '<div class="the qd"><h2>' + e(t('qdTieuDe')) + '</h2><p class="mo">' + e(t('qdGhi')) + '</p>' + anhQD() + '</div>' +
      hopPhieu(p);
    if ($('pdf')) $('pdf').onclick = taiPdf;
    ganLienHe();
  }
  function taiPdf() {
    var s = atob(KQ.pdf.b64), b = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([b], { type: 'application/pdf' })), a = document.createElement('a');
    a.href = url; a.download = KQ.pdf.ten || 'hop_dong.pdf'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 30000);
  }
  function lienHe() {
    return '<div class="lienhe"><a href="' + ZALO + '" target="_blank" rel="noopener">Zalo</a><a href="' + WA + '" target="_blank" rel="noopener">WhatsApp</a>' +
      '<button id="wc">WeChat</button></div><p class="mo" style="text-align:center;margin-top:8px">' + HOTLINE + ' · WeChat: ' + WECHAT + '</p>';
  }
  function ganLienHe() {
    var w = $('wc'); if (!w) return;
    w.onclick = function () { try { navigator.clipboard.writeText(WECHAT); } catch (x) {} w.textContent = t('saoChep'); };
  }

  /* ── khung ký: nét vẽ bằng ngón tay / chuột ── */
  var CK = (function () {
    var cv = null, ctx = null, nets = [], dang = null, dai = 0;
    function toaDo(ev) { var r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
    function kichThuoc() {
      var r = cv.getBoundingClientRect(), d = Math.max(1, window.devicePixelRatio || 1);
      cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
      ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.6; ctx.strokeStyle = '#112233';
      veLai();
    }
    function veLai() {
      var r = cv.getBoundingClientRect(); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
      nets.forEach(function (n) { ctx.beginPath(); n.forEach(function (p, i) { if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); }); ctx.stroke(); });
      var g = $('ckGoi'); if (g) g.style.display = nets.length ? 'none' : '';
    }
    function gan(el, anhCu) {
      cv = el; if (!anhCu) { nets = []; dai = 0; }
      kichThuoc();
      cv.addEventListener('pointerdown', function (ev) { ev.preventDefault(); cv.setPointerCapture(ev.pointerId); dang = [toaDo(ev)]; nets.push(dang); veLai(); });
      cv.addEventListener('pointermove', function (ev) {
        if (!dang) return; ev.preventDefault();
        var p = toaDo(ev), q = dang[dang.length - 1]; dai += Math.hypot(p.x - q.x, p.y - q.y);
        dang.push(p); ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (k) { cv.addEventListener(k, function () { dang = null; }); });
      window.addEventListener('resize', function () { if (cv && document.body.contains(cv)) kichThuoc(); });
    }
    function layAnh() {
      var r = cv.getBoundingClientRect(), w = Math.min(600, Math.round(r.width)), h = Math.round(w * r.height / r.width);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(cv, 0, 0, w, h);
      return c.toDataURL('image/png');
    }
    return { gan: gan, layAnh: layAnh, xoa: function () { nets = []; dai = 0; veLai(); }, du: function () { return nets.length > 0 && dai > 120; },
             coNet: function () { return !!cv && nets.length > 0 && document.body.contains(cv); } };
  })();

  tai();
})();
</script>
</body>
</html>
