<!-- QLVH · app cài điện thoại (PWA) · v1.5 · 13/11/2026 · đợt 2
     v1.5: 3 lệnh đọc nền lúc mở app (Việc định kỳ · Kiểm xe · Nhắc) gộp thành 1 lượt gọi V80_nen khi cổng báo «cong.nen».
     v1.4 · 13/11/2026 · đợt 2 (A138 · QĐ-D370 a)
     v1.4: MỞ APP BẤM ĐƯỢC NGAY bằng số lần trước trong máy (bỏ lớp chặn chạm); số mới tải ngầm, dải báo trên đầu.
           Mất mạng lúc mở: vẫn xem được số lần trước, tự thử lại. LỆNH GHI chỉ gửi khi số đang xem đã khớp sổ:
           chưa có số mới → chờ lấy xong; sổ đã đổi so với số đang xem → KHÔNG ghi, báo nạp số mới rồi làm lại.
     v1.3 · 13/11/2026 · đợt 1 «Nền an toàn» (A138 · QĐ-D368–D389, QĐ-D373 a)
     v1.3: mỗi lệnh GHI mang MÃ THAO TÁC; cổng đã chống trùng (khoiDong trả «cong.chongTrung») thì mạng chập chờn tự gửi lại
           đúng mã đó (≤ 2 lần), mất mạng hẳn thì GIỮ thao tác trong máy (≤ 300 KB, ≤ 24 giờ) và tự gửi khi có mạng —
           máy chủ không ghi 2 lần. Lỗi trang → lệnh NK_baoLoiApp (nhật ký + Telegram, không gửi dữ liệu khách).
           /qlvh/?thu = APP THỬ: cổng thử riêng (QLVH_THU, dữ liệu giả), lưu riêng trong máy, không khoá, nhãn «BẢN THỬ».
     v1.2 · 07/11/2026 · QĐ-D317 (a) · QĐ-D318 (a) · QĐ-D319 (a)
     v1.2: KHOÁ APP — mỗi lần mở / quay lại sau ≥ 1 phút / ngay sau «Khách ký trên máy này» phải mở bằng vân tay·khuôn mặt
           (WebAuthn của điện thoại) hoặc PIN 6 số. Máy chưa cài app (chưa có mã) mở /qlvh/ → về trang chủ web;
           màn Cài đặt chỉ mở bằng /qlvh/?caidat (lưu mã mới = đặt lại khoá).
     v1.1 · 07/10/2026 · QĐ-D165 (B)
     Khung này chỉ lo: lưu giao diện + số liệu lần trước trong máy, hiện ngay khi mở,
     rồi gọi cổng Apps Script (zz_v54) lấy số mới. Giao diện thật = Index.html của app hiện có. -->

<div class="hop" id="khung"><h1>QLVH</h1><div class="mo" id="trangThai">Đang mở…</div></div>
<script>
function QLVH_BAT_DAU() {
  'use strict';
  var CSS = "html,body{margin:0;background:#E9ECF0;font:16px ui-sans-serif,-apple-system,\"Segoe UI\",Roboto,Arial,sans-serif;color:#16181D} .hop{max-width:420px;margin:0 auto;padding:24px 16px} h1{font-size:20px;margin:0 0 12px} label{display:block;margin:14px 0 6px;font-weight:600} input{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border:1px solid #C9CFD8;border-radius:10px} button{margin-top:18px;width:100%;font-size:17px;padding:14px;border:0;border-radius:12px;background:#12674A;color:#fff} .mo{color:#5B6372;font-size:14px;margin-top:10px} .loi{color:#A3231C}";
  var CONG_MAC_DINH = 'https://script.google.com/macros/s/AKfycbyYcei_p4LostxboXINvDDUVjRvmJdkelJ6GvOVzQBlQYDzWzV5ZwSZNcxbI6Rpdyd2/exec';   // link cổng (không phải mã bí mật)
  var THU = /[?&]thu\b/.test(location.search);  // v1.3 · QĐ-D373 (a): app thử — mọi thứ lưu riêng, không đụng app thật
  var TT = THU ? 'pwa_thu_' : 'pwa_';
  var K = { cfg: TT + 'cfg', ui: TT + 'ui', uima: TT + 'ui_ma', dl: TT + 'dl', qt: TT + 'qt', khoa: TT + 'khoa', hang: TT + 'hang', cong: TT + 'cong' };
  if (THU) CONG_MAC_DINH = '';
  var KHOA_SAU_MS = 60000;                       // QĐ-D319 (a): quay lại sau ≥ 1 phút thì khoá
  function doc(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function luu(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function docJ(k) { try { return JSON.parse(doc(k) || 'null'); } catch (e) { return null; } }

  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }

  var cfg = docJ(K.cfg), laCaiDat = /[?&]caidat\b/.test(location.search);
  if (laCaiDat) { caiDat(cfg); return; }
  if (!cfg || !cfg.url || !cfg.k) { if (THU) { caiDat(cfg); return; } location.replace('/'); return; }      // QĐ-D317 C: máy lạ → trang chủ web

  /* ── gọi cổng · v1.3: lệnh GHI có mã thao tác; cổng chống trùng → tự gửi lại / giữ trong máy khi mất mạng ── */
  var DOC = ['khoiDong', 'layDuLieu', 'V26_dsQuocTich', 'V56_viecDinhKy', 'V57_trangThai', 'V58_kyTomTat', 'V66_duLieu',
             'V73_nhDoc', 'V73_nhPCCC', 'V75_trangThai', 'V75_xemTruoc', 'NK_baoLoiApp', 'V80_nen', 'V81_khachQuen',
             'V82_lich', 'V82_khach', 'V83_chiDoc'];   // v1.6: + khách quen · v1.7: + lịch đặt xe, hồ sơ khách · v1.8: + đọc chi
  var NEN = ['V56_viecDinhKy', 'V66_duLieu', 'V73_nhDoc'], pNen = null, lucNen = 0;        // v1.5: gộp 3 lệnh đọc nền
  function coNen() { var c = docJ(K.cong); return !!(c && c.nen); }
  function maTT() { try { return crypto.randomUUID(); } catch (e) { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 14); } }
  function coChongTrung() { var c = docJ(K.cong); return !!(c && c.chongTrung); }
  function goi1(body, ms) {
    var ctl = (ms && typeof AbortController !== 'undefined') ? new AbortController() : null;
    var tm = ctl ? setTimeout(function () { ctl.abort(); }, ms) : 0;
    return fetch(cfg.url, { method: 'POST', redirect: 'follow', signal: ctl ? ctl.signal : undefined,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) {
        clearTimeout(tm);
        if (!r.ok) { var e = new Error('HTTP ' + r.status); e.mang = r.status >= 500 || r.status === 429; throw e; }
        return r.json();
      }, function (e) {
        clearTimeout(tm);
        var x = new Error(e && e.name === 'AbortError' ? 'Mạng chậm — quá thời gian chờ' : 'Mất mạng / không tới được máy chủ'); x.mang = true; throw x;
      });
  }
  function goi(fn, args, them) {
    if (NEN.indexOf(fn) > -1 && !(args && args.length) && coNen()) {
      if (!pNen || Date.now() - lucNen > 12000) { lucNen = Date.now(); pNen = goi('V80_nen', []); }
      return pNen.then(function (o) { var x = o && o[fn]; if (!x) throw new Error('Thiếu ' + fn); if (!x.ok) throw new Error(x.loi || 'Lỗi đọc'); return x.r; });
    }
    var body = { k: cfg.k, fn: fn, args: args || [] };
    for (var x in (them || {})) body[x] = them[x];
    var ghi = DOC.indexOf(fn) < 0, an = ghi && coChongTrung(), lan = 0;
    if (ghi && !body.id) body.id = maTT();
    if (ghi && daMoApp && fn !== 'NK_gopY' && !/^V8[03]_/.test(fn)) return choSoMoi().then(gui);      // v1.4 · QĐ-D370: không ghi trên số cũ · v1.8: lệnh Việc / Chi không dựa vào số lượt thuê → bỏ chặn
    return gui();
    function gui() {
    function thu() {
      return goi1(body, an ? 90000 : (ghi ? 0 : 60000)).catch(function (e) {
        if (e.mang && an && lan < 2) { lan++; return new Promise(function (ok) { setTimeout(ok, lan * 2500); }).then(thu); }
        throw e;
      });
    }
    return thu().then(function (j) {
      if (!j.ok) { var e = new Error(j.loi || 'Cổng báo lỗi'); e.saiMa = /Sai mã/.test(j.loi || ''); throw e; }
      if (fn === 'layDuLieu') { luu(K.dl, JSON.stringify(j.r)); tuoi = true; choAp = null; boBang(); }
      if (fn === 'V26_dsQuocTich') luu(K.qt, JSON.stringify(j.r));
      return j.r;
    }, function (e) {
      if (!(e.mang && an)) throw e;
      return xepHangP(body).then(function (giu) {
        if (!giu) throw e;
        var q = new Error('Mất mạng — thao tác đã được GIỮ trong máy, tự gửi khi có mạng. Đừng bấm lại.'); q.xepHang = true; throw q;
      });
    });
    }
  }

  /* ── v1.4 · số đang xem có khớp sổ không (QĐ-D370 a) ── */
  var tuoi = false, pCap = null, choAp = null, henCap = 0;
  function vt(dl) {                                             // dấu vết phần số mà lệnh ghi dựa vào (bỏ phần đổi theo giờ)
    try {
      return JSON.stringify([(dl.xe || []).map(function (x) { return [x.stt, x.bien, x.tt, x.tt_goc, x.ghi_xe, x.nhan]; }),
        (dl.dangThue || []).map(function (h) { return [h.soHD, h.stt, h.bien, h.han_iso, h.sl, h.dg, h.gop, h.ck, h.coc, h.ghiL, h.ht]; }),
        (dl.suaChua || []).length, (dl.choDong || []).map(function (c) { return (c && c.soHD) || c; }), dl.ky || null, dl.dc || null]);
    } catch (e) { return 'loi' + Math.random(); }
  }
  function ban() {                                              // đang ở màn tác vụ / đang mở bảng xe → không vẽ lại dưới tay
    var m = document.getElementById('may'), s = document.getElementById('mo');
    return !!((m && /tac-vu/.test(m.className)) || (s && s.className));
  }
  function choSoMoi() {
    var doi = 'Sổ đã đổi so với số đang xem — CHƯA GHI. Xem lại số mới rồi làm lại.';
    if (choAp) return Promise.reject(new Error(doi + ' (chạm dải trên đầu để nạp số mới)'));
    if (tuoi) return Promise.resolve();
    return (pCap || capNhat()).then(function (kq) {
      if (kq && kq.doi) throw new Error(doi + (choAp ? ' (chạm dải trên đầu để nạp số mới)' : ''));
      if (!tuoi) throw new Error('Chưa lấy được số mới (mất mạng?) — CHƯA GHI để tránh ghi trên số cũ. Có mạng lại rồi bấm lại.');
    });
  }
  function apSo(r) {
    luuKhoiDong(r); choAp = null; tuoi = true;
    if (typeof window.napXong_ === 'function') window.napXong_(r.dl);
    if (typeof window.napQTXong_ === 'function') window.napQTXong_(r.qt);
    boBang();
  }

  /* ── hàng chờ mất mạng (chỉ khi cổng đã chống trùng: gửi lại đúng mã, máy chủ không ghi 2 lần) ── */
  function hangDoc() { return docJ(K.hang) || []; }
  function hangLuu(h) { luu(K.hang, JSON.stringify(h)); veHang(); }
  function xepHang(body) {
    var nd = JSON.stringify([body.fn, body.args]);
    if (nd.length > 300000) return false;                         // có ảnh lớn (giao xe) → không giữ; app vẫn lưu nháp như cũ
    var h = hangDoc();
    if (!h.some(function (x) { return x.id === body.id || JSON.stringify([x.fn, x.args]) === nd; }))
      h.push({ id: body.id, fn: body.fn, args: body.args, luc: Date.now() });
    hangLuu(h); return true;
  }
  /* v1.6 · lệnh có ảnh lớn (trả xe) → giữ ở IndexedDB, hàng chờ chỉ ghi mã; máy chủ chặn trả 2 lần (QĐ-D346) */
  var LON = ['dongLuotThue'];
  function kho(cach, k, v) {
    return new Promise(function (ok) {
      try {
        var r = indexedDB.open('qlvh_khung', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('hang'); };
        r.onerror = function () { ok(null); };
        r.onsuccess = function () {
          try {
            var tx = r.result.transaction('hang', cach === 'get' ? 'readonly' : 'readwrite'), st = tx.objectStore('hang');
            var rq = cach === 'get' ? st.get(k) : (cach === 'put' ? st.put(v, k) : st['delete'](k));
            rq.onsuccess = function () { ok(cach === 'get' ? (rq.result || null) : true); }; rq.onerror = function () { ok(null); };
          } catch (x) { ok(null); }
        };
      } catch (x) { ok(null); }
    });
  }
  function xepHangP(body) {
    var nd = JSON.stringify([body.fn, body.args]);
    if (nd.length <= 300000) return Promise.resolve(xepHang(body));
    if (LON.indexOf(body.fn) < 0 || nd.length > 12000000 || typeof indexedDB === 'undefined') return Promise.resolve(false);
    if (hangDoc().some(function (x) { return x.id === body.id; })) return Promise.resolve(true);
    return kho('put', body.id, body.args).then(function (ok) {
      if (!ok) return false;
      var h = hangDoc(); h.push({ id: body.id, fn: body.fn, args: null, idb: 1, luc: Date.now() }); hangLuu(h); return true;
    });
  }
  var dangGuiHang = false;
  function guiHang() {
    var h = hangDoc();
    if (!h.length || dangGuiHang || navigator.onLine === false) return;
    var dau = h[0];
    if (Date.now() - dau.luc > 86400000) {                        // quá 24 giờ → bỏ, báo rõ
      hangLuu(h.slice(1)); thongBao('Bỏ 1 thao tác chờ mạng quá 24 giờ (' + dau.fn + ') — làm lại trên app nếu còn cần.', true); return guiHang();
    }
    dangGuiHang = true;
    (dau.idb ? kho('get', dau.id) : Promise.resolve(dau.args)).then(function (args) {
      if (dau.idb && !args) {
        dangGuiHang = false; hangLuu(hangDoc().filter(function (x) { return x.id !== dau.id; }));
        thongBao('Không đọc được thao tác chờ mạng (' + dau.fn + ') trong máy — làm lại trên app.', true); return;
      }
      return goi1({ k: cfg.k, fn: dau.fn, args: args, id: dau.id }, 90000).then(daGui, function () { dangGuiHang = false; });
    });
    function daGui(j) {
      dangGuiHang = false;
      hangLuu(hangDoc().filter(function (x) { return x.id !== dau.id; }));
      if (dau.idb) kho('del', dau.id);
      if (j.ok) thongBao('Đã gửi thao tác chờ mạng (' + dau.fn + ').', false);
      else thongBao('Thao tác chờ mạng KHÔNG ghi được (' + dau.fn + '): ' + (j.loi || 'cổng báo lỗi'), true);
      if (hangDoc().length) guiHang(); else if (daMoApp) capNhat();
    }
  }
  function thongBao(chu, loi) {
    if (typeof window.bao === 'function') { try { window.bao(chu); } catch (e) {} }
    if (loi || typeof window.bao !== 'function') { try { alert(chu); } catch (e) {} }
  }
  function veHang() {
    if (!document.body) return;
    var n = hangDoc().length, b = document.getElementById('pwaHang');
    if (!n) { if (b) b.parentNode.removeChild(b); return; }
    if (!b) { b = document.createElement('div'); b.id = 'pwaHang'; b.onclick = guiHang; document.body.appendChild(b); }
    b.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:100002;padding:8px 12px;background:#B45309;color:#fff;' +
      'font:600 15px ui-sans-serif,-apple-system,Roboto,Arial,sans-serif;text-align:center');
    b.textContent = '⏳ ' + n + ' thao tác chờ mạng — tự gửi khi có mạng (chạm để gửi ngay)';
  }
  setInterval(guiHang, 60000);

  /* ── lỗi trang → nhật ký máy chủ (NK_baoLoiApp) · tối đa 5 lỗi khác nhau mỗi lần mở · không gửi dữ liệu khách ── */
  var daBao = {}, soBao = 0;
  function baoLoi(loi, nguon) {
    try {
      loi = String(loi || '').slice(0, 300);
      if (!loi || /^Script error\.?$|ResizeObserver loop/.test(loi) || daBao[loi] || soBao >= 5) return;
      daBao[loi] = 1; soBao++;
      goi1({ k: cfg.k, fn: 'NK_baoLoiApp', args: [{ loi: loi, nguon: String(nguon || '').slice(0, 120),
        ver: 'khung 1.7' + (THU ? ' thử' : '') + ' · ui ' + (doc(K.uima) || '-'), ua: String(navigator.userAgent || '').slice(0, 120) }] }, 20000)
        .catch(function () {});
    } catch (e) {}
  }
  /* document.open() XOÁ mọi trình nghe trên window → gắn lại sau mỗi lần dựng trang (hien) */
  function ganLangNghe() {
    window.addEventListener('online', function () { setTimeout(guiHang, 1500); if (!tuoi && daMoApp) setTimeout(capNhat, 800); });
    window.addEventListener('error', function (ev) {
      if (ev && ev.message) baoLoi(ev.message, String(ev.filename || '').split('/').pop() + ':' + ev.lineno + ':' + ev.colno);
    });
    window.addEventListener('unhandledrejection', function (ev) { var r = ev && ev.reason; baoLoi(r && r.message || r, 'promise'); });
  }
  ganLangNghe();

  /* ── google.script.run giả: cùng cách gọi như app cũ ── */
  function taoRun(s, f, u) {
    return new Proxy({}, { get: function (_, ten) {
      if (ten === 'withSuccessHandler') return function (h) { return taoRun(h, f, u); };
      if (ten === 'withFailureHandler') return function (h) { return taoRun(s, h, u); };
      if (ten === 'withUserObject') return function (o) { return taoRun(s, f, o); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        goi(String(ten), args).then(function (r) { if (s) s(r, u); },
          function (e) { if (e.saiMa) return caiDat(cfg, e.message); if (f) f(e, u); });
      };
    } });
  }
  window.google = { script: { run: taoRun(null, null, undefined) } };
  window.__PWA = { goi: goi, caiDat: function () { caiDat(cfg); }, thu: THU, hang: function () { return hangDoc().length; }, guiHang: guiHang };

  /* ── mở app (sau khi mở khoá) ── */
  var daMoApp = false;
  if (THU) moApp(); else khoaManHinh(true, moApp);              // app thử: dữ liệu giả, không khoá

  function moApp() {
  if (daMoApp) return; daMoApp = true;
  var ui = doc(K.ui), dl = docJ(K.dl), qt = docJ(K.qt);
  if (ui && dl) {
    hien(ui, dl, qt, true);
    capNhat();
  } else {
    $('trangThai').textContent = 'Lần đầu mở: đang tải giao diện và số liệu…';
    goi('khoiDong', [], { ui_ma: '' }).then(function (r) {
      luuKhoiDong(r); tuoi = true;
      hien(r.ui, r.dl, r.qt, false);
    }, function (e) {
      if (e.saiMa) return caiDat(cfg, e.message);
      $('trangThai').innerHTML = '<span class="loi">Không mở được: ' + e.message + '</span><br>Kiểm tra mạng rồi mở lại.';
    });
  }
  }

  function luuKhoiDong(r) {
    luu(K.dl, JSON.stringify(r.dl)); luu(K.qt, JSON.stringify(r.qt));
    if (r.cong) luu(K.cong, JSON.stringify(r.cong)); else { try { localStorage.removeItem(K.cong); } catch (e) {} }
    if (r.ui) { luu(K.ui, r.ui); luu(K.uima, r.ui_ma); }
  }

  /* Ghi giao diện app vào trang + số liệu sẵn có (window.__DL0/__QT0 — Index.html v3.1 đọc ngay). */
  function hien(html, dl, qt, khoa) {
    window.__DL0 = dl; window.__QT0 = qt;
    var them = '<link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes">' +
      '<style>#pwaBang{position:fixed;left:0;right:0;top:0;z-index:100000;padding:calc(4px + env(safe-area-inset-top)) 12px 4px;' +
      'background:rgba(29,78,137,.94);color:#fff;font:13px ui-sans-serif,-apple-system,Roboto,Arial,sans-serif;text-align:center;pointer-events:none}' +
      '#pwaBang.loi,#pwaBang.doi{pointer-events:auto;padding-top:calc(9px + env(safe-area-inset-top));padding-bottom:9px;font-size:15px}' +
      '#pwaBang.loi{background:#A3231C}#pwaBang.doi{background:#B45309}</style>';
    var i = html.indexOf('<head>');
    html = i > -1 ? html.slice(0, i + 6) + them + html.slice(i + 6) : them + html;
    document.open(); document.write(html); document.close();
    ganLangNghe();
    if (!THU) ganTheoDoiKhoa();
    else { var t = document.createElement('div'); t.textContent = 'BẢN THỬ';
      t.setAttribute('style', 'position:fixed;right:0;bottom:64px;z-index:100003;background:#C2410C;color:#fff;font:700 13px sans-serif;padding:4px 10px;border-radius:10px 0 0 10px;pointer-events:none');
      document.body.appendChild(t); }
    veHang(); setTimeout(guiHang, 3000);
    if (khoa) bang('Số lúc ' + ((dl && dl.bay_gio) || '').replace('T', ' ') + ' — đang lấy số mới…', '');
  }

  function bang(chu, loai) {                                    // dải báo trên đầu — KHÔNG chặn chạm
    function lam() {
      var b = document.getElementById('pwaBang');
      if (!b) { b = document.createElement('div'); b.id = 'pwaBang'; document.body.appendChild(b);
        b.onclick = function () { if (b.className === 'doi' && choAp) apSo(choAp); else if (b.className === 'loi') capNhat(); }; }
      b.textContent = chu; b.className = loai || '';
    }
    if (document.body) lam(); else document.addEventListener('DOMContentLoaded', lam);
  }
  function boBang() { var e = document.getElementById('pwaBang'); if (e) e.parentNode.removeChild(e); }

  /* Lấy số mới ngầm. Trả Promise → {doi: số mới KHÁC số đang xem} | false (không lấy được). */
  function capNhat() {
    if (pCap) return pCap;
    clearTimeout(henCap);
    if (!document.getElementById('pwaBang') || document.getElementById('pwaBang').className === 'loi') bang('Đang lấy số mới…', '');
    pCap = goi('khoiDong', [], { ui_ma: doc(K.uima) || '' }).then(function (r) {
      pCap = null;
      var cu = docJ(K.dl), doi = !cu || vt(cu) !== vt(r.dl);
      if (!doi) { luuKhoiDong(r); tuoi = true; choAp = null; if (!ban()) apSo(r); else boBang(); }
      else if (!ban()) apSo(r);
      else { choAp = r; tuoi = false; bang('Sổ có thay đổi — chạm đây để nạp số mới', 'doi'); }
      if (r.ui && typeof window.bao === 'function') window.bao('Có bản giao diện mới — mở lại app để dùng.');
      return { doi: doi };
    }, function (e) {
      pCap = null;
      if (e.saiMa) { caiDat(cfg, e.message); return false; }
      bang('Chưa lấy được số mới (' + e.message + ') — đang xem số lần trước, chưa ghi được. Chạm để thử lại.', 'loi');
      henCap = setTimeout(function () { if (!tuoi && document.visibilityState !== 'hidden') capNhat(); }, 20000);
      return false;
    });
    return pCap;
  }

  function $(id) { return document.getElementById(id); }

  /* ══════════ KHOÁ APP · QĐ-D317 B · D318 (a) vân tay/khuôn mặt + PIN 6 số · D319 (a) ══════════
     Khoá chỉ chặn người cầm máy (khách ký trên máy Bên A). Mã bí mật cổng vẫn là lớp bảo vệ số liệu. */
  var dangKhoa = false, anLuc = 0, khoaNgay = false;

  function kDoc() { return docJ(K.khoa); }
  function kLuu(o) { luu(K.khoa, JSON.stringify(o)); }
  function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function ngauNhien(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
  function bam(salt, pin) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)).then(function (h) { return b64(h); });
  }
  function coSinhTrac() {
    try {
      if (!window.PublicKeyCredential || !PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) return Promise.resolve(false);
      return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(function () { return false; });
    } catch (e) { return Promise.resolve(false); }
  }

  /* Lớp khoá nằm trong shadow DOM: không lẫn CSS của Index.html; phần app phía sau đặt inert. */
  function lop() {
    var host = document.getElementById('qlvhKhoa');
    if (!host) {
      host = document.createElement('div'); host.id = 'qlvhKhoa';
      host.setAttribute('style', 'position:fixed;inset:0;z-index:2147483647;background:#E9ECF0;overflow:auto');
      (document.body || document.documentElement).appendChild(host);
      host.attachShadow({ mode: 'open' });
    }
    Array.prototype.forEach.call(document.body ? document.body.children : [], function (el) { if (el !== host) el.setAttribute('inert', ''); });
    return host;
  }
  function boLop() {
    var host = document.getElementById('qlvhKhoa'); if (host) host.parentNode.removeChild(host);
    Array.prototype.forEach.call(document.body ? document.body.children : [], function (el) { el.removeAttribute('inert'); });
  }
  function ve(host, html) {
    host.shadowRoot.innerHTML = '<style>' + CSS + ' .hop{padding-top:56px} .pin{letter-spacing:8px;text-align:center;font-size:24px}' +
      ' .phu{background:#fff;color:#12674A;border:1px solid #12674A} .nho{font-size:13px;color:#5B6372;margin-top:16px;line-height:1.5}</style>' +
      '<div class="hop">' + html + '</div>';
    return function (id) { return host.shadowRoot.getElementById(id); };
  }

  /** dauTien = lúc mở app (chưa có giao diện) · xong = gọi khi mở khoá */
  function khoaManHinh(dauTien, xong) {
    dangKhoa = true;
    var k = kDoc();
    if (!k || !k.pin) return datKhoa(xong);
    var host = lop();
    var g = ve(host, '<h1>🔒 QLVH đã khoá</h1>' +
      '<button id="vt" style="display:none">Mở bằng vân tay / khuôn mặt</button>' +
      '<label for="p">PIN 6 số</label><input id="p" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">' +
      '<button id="ok" class="phu">Mở bằng PIN</button><div id="tb" class="mo"></div>' +
      '<div class="nho">Quên PIN: mở <b>' + location.origin + location.pathname + '?caidat</b>, nhập lại mã bí mật → đặt PIN mới.</div>');
    function mo() { dangKhoa = false; khoaNgay = false; var k2 = kDoc(); if (k2) { k2.sai = 0; k2.cho = 0; kLuu(k2); } boLop(); if (xong) xong(); }
    function choCon() { var k2 = kDoc() || {}; return Math.max(0, (k2.cho || 0) - Date.now()); }
    function thuPin() {
      var w = choCon();
      if (w) { g('tb').innerHTML = '<span class="loi">Sai nhiều lần — chờ ' + Math.ceil(w / 1000) + ' giây.</span>'; return; }
      var p = g('p').value.trim();
      if (!/^\d{6}$/.test(p)) { g('tb').innerHTML = '<span class="loi">PIN gồm 6 chữ số.</span>'; return; }
      var k2 = kDoc();
      bam(k2.salt, p).then(function (h) {
        if (h === k2.pin) return mo();
        k2.sai = (k2.sai || 0) + 1;
        if (k2.sai >= 5) k2.cho = Date.now() + Math.min(900000, 30000 * Math.pow(2, k2.sai - 5));
        kLuu(k2); g('p').value = '';
        g('tb').innerHTML = '<span class="loi">Sai PIN (' + k2.sai + ' lần).</span>';
      });
    }
    function thuVanTay() {
      var k2 = kDoc();
      navigator.credentials.get({ publicKey: { challenge: ngauNhien(32), timeout: 60000, userVerification: 'required',
        allowCredentials: [{ type: 'public-key', id: unb64(k2.cred) }] } })
        .then(function (c) { if (c) mo(); }, function () { g('tb').textContent = 'Chưa mở được bằng vân tay — bấm lại hoặc dùng PIN.'; });
    }
    g('ok').onclick = thuPin;
    g('p').onkeydown = function (ev) { if (ev.key === 'Enter') thuPin(); };
    if (k.cred) coSinhTrac().then(function (co) {
      if (!co) return;
      g('vt').style.display = 'block'; g('vt').onclick = thuVanTay;
      if (document.visibilityState === 'visible') thuVanTay();
    });
  }

  /** Lần đầu sau cập nhật (hoặc sau khi lưu mã mới): đặt PIN, rồi bật vân tay nếu máy có. */
  function datKhoa(xong) {
    var host = lop();
    var g = ve(host, '<h1>Đặt khoá app QLVH</h1>' +
      '<div class="mo">Khách ký trên máy này không mở được app nếu không có vân tay / PIN của Anh.</div>' +
      '<label for="p1">PIN 6 số</label><input id="p1" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">' +
      '<label for="p2">Nhập lại PIN</label><input id="p2" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">' +
      '<button id="ok">Lưu PIN</button><div id="tb" class="mo"></div>');
    g('ok').onclick = function () {
      var a = g('p1').value.trim(), b = g('p2').value.trim();
      if (!/^\d{6}$/.test(a)) { g('tb').innerHTML = '<span class="loi">PIN gồm đúng 6 chữ số.</span>'; return; }
      if (a !== b) { g('tb').innerHTML = '<span class="loi">Hai lần nhập không khớp.</span>'; return; }
      if (/^(\d)\1{5}$/.test(a) || a === '123456' || a === '654321') { g('tb').innerHTML = '<span class="loi">PIN dễ đoán — chọn số khác.</span>'; return; }
      var salt = b64(ngauNhien(16));
      bam(salt, a).then(function (h) {
        kLuu({ v: 1, salt: salt, pin: h, cred: '', sai: 0, cho: 0 });
        coSinhTrac().then(function (co) { if (co) hoiVanTay(); else xongDat(); });
      });
    };
    function hoiVanTay() {
      g = ve(host, '<h1>Mở bằng vân tay / khuôn mặt?</h1><div class="mo">Dùng vân tay hoặc khuôn mặt đã cài trên điện thoại. PIN vẫn dùng được khi cần.</div>' +
        '<button id="bat">Bật vân tay / khuôn mặt</button><button id="bo" class="phu">Để sau — chỉ dùng PIN</button><div id="tb" class="mo"></div>');
      g('bo').onclick = xongDat;
      g('bat').onclick = function () {
        navigator.credentials.create({ publicKey: {
          rp: { name: 'QLVH An Việt' }, user: { id: ngauNhien(16), name: 'qlvh', displayName: 'QLVH An Việt' },
          challenge: ngauNhien(32), pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
          timeout: 60000, attestation: 'none' } })
          .then(function (c) { var k = kDoc(); k.cred = b64(c.rawId); kLuu(k); xongDat(); },
                function (e) { g('tb').innerHTML = '<span class="loi">Chưa bật được (' + (e && e.name || 'lỗi') + ') — bấm lại hoặc «Để sau».</span>'; });
      };
    }
    function xongDat() { dangKhoa = false; boLop(); if (xong) xong(); }
  }

  /** Gắn sau khi giao diện app đã ghi vào trang (document.open xoá mọi trình nghe cũ). */
  function ganTheoDoiKhoa() {
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { anLuc = Date.now(); if (khoaNgay && !dangKhoa) khoaManHinh(false, null); return; }
      if (!dangKhoa && anLuc && Date.now() - anLuc >= KHOA_SAU_MS) khoaManHinh(false, null);
    });
    window.addEventListener('pageshow', function (ev) { if (ev.persisted && !dangKhoa) khoaManHinh(false, null); });
    /* «Khách ký trên máy này» mở trang ký → khoá NGAY, để khách quay lại cũng chỉ thấy màn khoá */
    var moGoc = window.open;
    window.open = function (u) {
      var w = moGoc.apply(window, arguments);
      if (/\/ky\//.test(String(u || ''))) { khoaNgay = true; setTimeout(function () { if (!dangKhoa) khoaManHinh(false, null); }, 300); }
      return w;
    };
    document.addEventListener('click', function (ev) {
      var a = ev.target && ev.target.closest ? ev.target.closest('a[href*="/ky/"]') : null;
      if (a) { khoaNgay = true; setTimeout(function () { if (!dangKhoa) khoaManHinh(false, null); }, 300); }
    }, true);
  }

  function caiDat(c, loi) {
    c = c || {};
    document.open();
    document.write('<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<link rel="manifest" href="manifest.webmanifest"><style>' + CSS + '</style></head><body><div class="hop">' +
      '<h1>Cài đặt app QLVH' + (THU ? ' — BẢN THỬ (sổ QLVH_THU, dữ liệu giả)' : '') + '</h1>' + (loi ? '<div class="loi">' + loi + '</div>' : '') +
      '<label for="u">Địa chỉ cổng (link /exec bản triển khai «Bất kỳ ai»)</label><input id="u" inputmode="url" autocomplete="off">' +
      '<label for="m">Mã bí mật</label><input id="m" autocomplete="off">' +
      '<button id="ok">Lưu và mở app</button>' +
      '<div class="mo">Chỉ nhập một lần trên điện thoại này. Mã không nằm trong mã trang. Lưu xong sẽ đặt lại khoá app (PIN, vân tay).</div></div></body></html>');
    document.close();
    document.getElementById('u').value = c.url || CONG_MAC_DINH;
    document.getElementById('m').value = c.k || '';
    document.getElementById('ok').onclick = function () {
      var u = document.getElementById('u').value.trim(), m = document.getElementById('m').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)) { alert('Link phải dạng https://script.google.com/macros/s/…/exec'); return; }
      if (!m) { alert('Chưa nhập mã'); return; }
      luu(K.cfg, JSON.stringify({ url: u, k: m }));
      try { localStorage.removeItem(K.khoa); } catch (e) {}     // mã mới = đặt lại khoá app
      location.href = location.pathname + (THU ? '?thu' : '');
    };
  }
}
